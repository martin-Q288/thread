name: V33 core browser smoke test

on:
  push:
    branches:
      - donbok-mvp
    paths:
      - .github/workflows/v32-browser-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: donbok-mvp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          python3 -m http.server 4173 --directory donbok >/tmp/hyun-http.log 2>&1 &
          sleep 2

      - name: Run V33 core flow
        run: |
          cat > v33-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const hard=setTimeout(()=>{console.error('HARD TIMEOUT V33');process.exit(2)},30000);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          page.setDefaultTimeout(10000);
          page.on('console',m=>console.log('BROWSER '+m.type()+': '+m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR '+e.message));
          page.on('requestfailed',r=>console.log('REQFAIL '+r.url()+' '+(r.failure()?.errorText||'')));

          await page.goto('http://127.0.0.1:4173/v33.html?test=1',{waitUntil:'domcontentloaded'});
          const badge=(await page.locator('#v33Badge').innerText()).trim();
          console.log('badge='+badge);
          await page.click('#enterBtn');
          await page.fill('#name','테스트');
          await page.fill('#year','1992');
          await page.fill('#month','10');
          await page.fill('#day','24');
          await page.selectOption('#hour','12');
          await page.fill('#minute','0');
          console.log('click submit');
          await page.click('#submitBtn');
          console.log('submit clicked');
          await page.waitForSelector('#result:not(.hide)',{timeout:20000});
          const reading=await page.locator('#readingMount').innerText();
          console.log('readingChars='+reading.length);
          if(reading.trim().length<50) throw new Error('reading too short');
          console.log('PASS V33 CORE');
          clearTimeout(hard);
          process.exit(0);
          EOF
          node v33-smoke.mjs
